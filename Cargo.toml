[package]
name = "troit-logistics-backend"
version = "0.1.0"
edition = "2021"
authors = ["TROIT Logistics Team <dev@troitlogistics.com>"]
description = "Backend REST API service foundation for TROIT Logistics trust and logistics platform."

[dependencies]
# Web Framework & Async Runtime
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower_governor = { version = "=0.4.3", features = ["axum"] }

# Serialization & Validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.21", features = ["derive"] }

# Database & Migrations
sqlx = { version = "0.8.0", features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate"
] }

# Security & Authentication
argon2 = "0.5.3"
jsonwebtoken = "9.3.0"

# Logging & Observability
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Utilities & Error Handling
dotenvy = "0.15.7"
thiserror = "1.0.61"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
stellar-strkey = "0.0.8"
stellar-xdr = { version = "21.2.0", features = ["std"] }
ed25519-dalek = "2.1"
sha2 = "0.10"

# Object Storage & File Type Inspection (Cloudflare R2 / S3)
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
infer = "0.16.0"

# Force patched TLS stack (>=0.23.45) to avoid vulnerable transitive versions
rustls = "0.23.45"

[dev-dependencies]
tower = { version = "0.4.13", features = ["util"] }

